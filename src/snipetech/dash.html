<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snipetech</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --fg:#e6e6e6; --dim:#9aa0a6; --ok:#2ecc71; --warn:#f1c40f; --crit:#e74c3c; --line:#262a33; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; letter-spacing:.3px; }
  header .meta { color:var(--dim); font-size:12px; }
  main { padding:12px 16px 40px; display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); max-width:1400px; margin:0 auto; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:0; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--dim); margin:0 0 8px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; }
  .kv div:nth-child(odd) { color:var(--dim); }
  .big { font-size:26px; font-weight:600; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .ok { background:var(--ok); } .warn { background:var(--warn); } .crit { background:var(--crit); } .unknown { background:var(--dim); }
  ul { margin:0; padding-left:0; list-style:none; }
  li { padding:4px 0; border-top:1px solid var(--line); word-break:break-word; }
  li:first-child { border-top:0; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; }
  .dim { color:var(--dim); }
  .banner { grid-column:1/-1; padding:10px 14px; border-radius:10px; font-weight:600; }
  .banner.stop { background:#3a1f1f; color:#ffb4b4; }
  .banner.err { background:#3a2f1f; color:#ffe0a8; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td, th { text-align:left; padding:3px 6px 3px 0; border-top:1px solid var(--line); white-space:nowrap; }
  th { color:var(--dim); font-weight:500; border-top:0; }
  .right { text-align:right; }
</style>
</head>
<body>
<header>
  <h1>snipetech</h1>
  <span class="meta" id="meta">loading…</span>
</header>
<main id="main"></main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const ago = (ts, now) => { if (!ts) return "never"; const s = Math.max(0, now - ts); return s < 90 ? s + " s ago" : s < 5400 ? Math.round(s/60) + " min ago" : (s/3600).toFixed(1) + " h ago"; };
  const dot = (st) => `<span class="dot ${esc(st)}"></span>`;
  const svcClass = (v) => v === "active" ? "ok" : (v === "inactive" || v === "unknown") ? "warn" : "crit";
  const num = (v, d) => v == null ? "—" : Number(v).toFixed(d);

  function render(s) {
    const now = s.generated_at;
    const parts = [];
    if (s.book && s.book.stopped) parts.push(`<div class="banner stop">STOPPED by owner (/stop). No sniper is expected until /resume.</div>`);
    if (s.snapshot && s.snapshot.errors && s.snapshot.errors.length) parts.push(`<div class="banner err">snapshot errors: ${esc(s.snapshot.errors.join("; "))}</div>`);

    const snap = s.snapshot || {};
    parts.push(`<section><h2>Wallet</h2>
      <div class="big">${snap.equity == null ? "unknown" : num(snap.equity, 3) + " SOL"}</div>
      <div class="kv">
        <div>SOL / wSOL</div><div>${num(snap.native_sol, 3)} / ${num(snap.wsol, 3)}</div>
        <div>coins held</div><div>${snap.held ?? "—"}</div>
        <div>snipers</div><div>${snap.snipers_known ? (Object.entries(snap.snipers || {}).map(([k,v]) => v + " " + k).join(", ") || "none") : '<span class="dim">unknown (OKTech not answering)</span>'}</div>
        <div>fills since last round</div><div>${snap.fills_since_last ?? 0}</div>
        <div>snapshot</div><div>${ago(snap.ts, now)}</div>
        <div>tape lag</div><div>${snap.tape_lag_secs == null ? "—" : snap.tape_lag_secs + " s"}</div>
        <div>book</div><div>${s.book && s.book.enabled ? "on" : "off"}</div>
      </div></section>`);

    const svcs = Object.entries(s.services || {});
    parts.push(`<section><h2>Services</h2><ul>${svcs.map(([k,v]) => `<li>${dot(svcClass(v))}${esc(k)} <span class="dim">${esc(v)}</span></li>`).join("") || "<li class='dim'>none</li>"}</ul>
      <div class="kv" style="margin-top:8px"><div>disk free</div><div>${s.disk_gb ? s.disk_gb.free + " / " + s.disk_gb.total + " GB" : "—"}</div>
      <div>tape</div><div>${s.tape && s.tape.hours != null ? s.tape.hours + " h in " + s.tape.spans + " span(s)" : "—"}</div>
      <div>code</div><div class="mono">${esc(s.version || "—")}</div></div></section>`);

    const res = s.resources || [];
    parts.push(`<section><h2>Resources</h2><ul>${res.map(r => `<li>${dot(r.status)}<b>${esc(r.name)}</b> <span class="dim">${esc(r.message)}</span></li>`).join("") || "<li class='dim'>no resource check yet</li>"}</ul></section>`);

    const op = s.operator || {};
    parts.push(`<section><h2>Operator</h2>
      <div class="kv"><div>Claude spend</div><div>${num(op.spend_today_usd, 2)} $ today, ${num(op.spend_7d_usd, 2)} $ in 7 d</div>
      <div>last round</div><div>${ago(op.last_round, now)}</div><div>telegram</div><div>${op.telegram ? "connected" : "not set up"}</div></div>
      <h2 style="margin-top:10px">Last decisions</h2><ul class="mono">${(op.decisions || []).slice().reverse().map(l => `<li>${esc(l.replace(/^- /, ""))}</li>`).join("") || "<li class='dim'>none yet</li>"}</ul></section>`);

    const jobs = s.jobs || [];
    parts.push(`<section><h2>Jobs</h2><table><tr><th>job</th><th>command</th><th class="right">state</th></tr>
      ${jobs.map(j => `<tr><td class="mono">${esc(j.id)}</td><td class="mono">${esc(j.argv)}</td><td class="right">${j.running ? dot("warn") + "running " + ago(j.started, now) : dot(j.exit_code === 0 ? "ok" : "crit") + "exit " + esc(j.exit_code) + " " + ago(j.ended, now)}</td></tr>`).join("") || "<tr><td class='dim' colspan=3>no jobs</td></tr>"}</table></section>`);

    const c = s.candidates || {counts: {}, top: []};
    parts.push(`<section><h2>Candidates <span class="dim">(${esc(c.source)})</span></h2>
      <div class="dim">${Object.entries(c.counts || {}).map(([k,v]) => v + " " + k).join(", ") || "none yet"}</div>
      <table>${(c.top || []).map(x => `<tr><td class="mono">${esc(x.wallet)}</td><td>${esc(x.source || "")}</td><td class="right">${x.score == null ? "" : num(x.score, 3)}</td></tr>`).join("")}</table></section>`);

    const fills = s.fills || [];
    parts.push(`<section><h2>Fills</h2><table>${fills.map(f => `<tr><td class="dim">${ago(f.ts, now)}</td><td>${esc(f.side)}</td><td class="mono">${esc(String(f.mint || "").slice(0, 8))}…</td><td class="right">${num(f.sol, 3)} SOL</td></tr>`).join("") || "<tr><td class='dim'>no fills table yet (phase 3)</td></tr>"}</table></section>`);

    parts.push(`<section><h2>Recent notes</h2><ul class="mono">${(op.notes || []).slice().reverse().map(l => `<li>${esc(l.replace(/^- /, ""))}</li>`).join("") || "<li class='dim'>none yet</li>"}</ul></section>`);

    $("main").innerHTML = parts.join("");
    $("meta").textContent = "updated " + new Date(now * 1000).toISOString().replace("T", " ").slice(0, 19) + " UTC · refreshes every 15 s";
  }

  async function tick() {
    try {
      const r = await fetch("/api/dash/state", {cache: "no-store"});
      if (!r.ok) { $("meta").textContent = "state: HTTP " + r.status; return; }
      render(await r.json());
    } catch (e) { $("meta").textContent = "state: " + e; }
  }
  tick();
  setInterval(tick, 15000);
})();
</script>
</body>
</html>

# The server's settings file (/etc/snipetech/snipetech.toml) as `snipetech doctor --settings` showed it on
# 11 Nov 2026 07:28 UTC: `init`'s dump of every default of its day plus the owner's limits. Where it differs
# from the code of that day it holds the server's value; the wallet is a placeholder. Never regenerate it from
# today's defaults: tests/test_config_drift.py uses it to prove that a default changed in the code reaches the
# server.


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snipetech"
version = "0.1.0"
description = "Profitability intelligence for pump.fun snipers and copytraders: deployer rinse detection, copytrade edge, strategy backtests, live signals and a Claude agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "anthropic>=2.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
snipetech = "snipetech.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snipetech.solana.idl" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
